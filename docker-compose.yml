# ClaimFlow: local stack. Only Docker is needed on the host.
#   docker compose run --rm init     -> first run only: .env with fresh secrets + local CA/certs
#   docker compose up -d             -> Caddy + n8n + Postgres + Mailpit, then the one-shot
#                                       deploy service (credentials, seed PII, workflows)
# Local LLM: set LLM_MODE=ollama and COMPOSE_PROFILES=ollama in .env, then docker compose up -d.
#
# Only Caddy (HTTPS) and Postgres (TLS required) are published, on 127.0.0.1 only.
# Certificates in ./certs come from one local CA created by the init service (gitignored).

name: claimflow

# n8n's settings, shared by the n8n server and the deploy service (same DB, keys and app config).
x-n8n-env: &n8n-env
  # --- n8n's own storage: workflows, credentials, execution history ---
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: 5432
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: ${N8N_DB_USER}
  DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
  DB_POSTGRESDB_SSL_ENABLED: "true"
  DB_POSTGRESDB_SSL_CA_FILE: /certs/ca.crt   # _FILE: n8n reads the PEM from this path
  DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED: "true"

  # Encrypts stored credentials. If you lose it, saved credentials become unreadable.
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

  # --- URLs: n8n speaks plain HTTP inside Docker; Caddy terminates TLS in front of it ---
  N8N_HOST: localhost
  N8N_PORT: 5678
  N8N_PROTOCOL: http
  N8N_PROXY_HOPS: "1"                      # trust X-Forwarded-* from Caddy
  WEBHOOK_URL: ${N8N_PUBLIC_URL}
  N8N_EDITOR_BASE_URL: ${N8N_PUBLIC_URL}
  N8N_SECURE_COOKIE: "true"
  # Trust the local CA for outgoing TLS (SMTP STARTTLS to Mailpit, etc.)
  NODE_EXTRA_CA_CERTS: /certs/ca.crt

  # --- Locale ---
  GENERIC_TIMEZONE: ${TZ}      # used by Schedule Trigger (07:00 SAST report)
  TZ: ${TZ}

  # --- Behaviour ---
  # Code nodes read LLM_MODE, rules config and PII keys from env, which n8n 2.x blocks by default.
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
  # Code nodes may use Node's crypto module (PII encryption). Nothing else is allowed.
  NODE_FUNCTION_ALLOW_BUILTIN: crypto
  # Code nodes run in a "task runner" process; cap each run (default will change upstream).
  N8N_RUNNERS_TASK_TIMEOUT: "60"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "168"   # hours (7 days); PI workflows also skip saving successful runs
  # Successful runs of PI workflows are soft-deleted at once (their start data still holds the
  # raw webhook body); hard-delete them every 5 min instead of the default 15.
  EXECUTIONS_DATA_PRUNE_HARD_DELETE_INTERVAL: "5"

  # --- App settings read by the workflows via $env ---
  LLM_MODE: ${LLM_MODE}
  OPENAI_MODEL: ${OPENAI_MODEL}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
  OLLAMA_MODEL: ${OLLAMA_MODEL}
  CLAIMFLOW_FRAUD_TEAM_EMAIL: ${CLAIMFLOW_FRAUD_TEAM_EMAIL}
  CLAIMFLOW_OPS_EMAIL: ${CLAIMFLOW_OPS_EMAIL}
  CLAIMFLOW_FROM_EMAIL: ${CLAIMFLOW_FROM_EMAIL}
  CLAIMFLOW_REVIEW_TIMEOUT_MINUTES: ${CLAIMFLOW_REVIEW_TIMEOUT_MINUTES}
  CLAIMFLOW_SLA_HOURS: ${CLAIMFLOW_SLA_HOURS}
  # Field-level PII encryption (AES-256-GCM) and blind-index (HMAC) keys
  CLAIMFLOW_PII_KEY: ${CLAIMFLOW_PII_KEY}
  CLAIMFLOW_PII_HMAC_KEY: ${CLAIMFLOW_PII_HMAC_KEY}
  CLAIMFLOW_STATUS_LINK_KEY: ${CLAIMFLOW_STATUS_LINK_KEY}
  # Demo mode: claim form + Claim Trace page (workflow 07). Local demos only, never production.
  CLAIMFLOW_DEMO_MODE: ${CLAIMFLOW_DEMO_MODE:-false}
  CLAIMFLOW_MAILPIT_URL: https://localhost:${MAILPIT_UI_PORT:-8025}/

  # --- Used only by the deploy service to create credentials (never stored in workflow JSON) ---
  CLAIMFLOW_DB_USER: ${CLAIMFLOW_DB_USER}
  CLAIMFLOW_DB_PASSWORD: ${CLAIMFLOW_DB_PASSWORD}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}


services:
  caddy:
    # TLS termination for the n8n editor/webhooks and the Mailpit web inbox.
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    depends_on:
      - n8n
      - mailpit
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
    ports:
      - "127.0.0.1:${HTTPS_PORT:-8443}:8443"         # n8n editor + webhooks
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"    # Mailpit web inbox

  postgres:
    image: postgres:16.16-alpine
    restart: unless-stopped
    # Postgres refuses a private key that isn't owned by it with mode 600, which a Windows
    # bind mount can't provide. So copy the cert/key in with the right owner, then start.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        install -d -o postgres -g postgres -m 700 /var/lib/postgresql/ssl &&
        install -o postgres -g postgres -m 600 /certs/postgres.key /var/lib/postgresql/ssl/server.key &&
        install -o postgres -g postgres -m 644 /certs/postgres.crt /var/lib/postgresql/ssl/server.crt &&
        exec docker-entrypoint.sh postgres
        -c ssl=on
        -c ssl_cert_file=/var/lib/postgresql/ssl/server.crt
        -c ssl_key_file=/var/lib/postgresql/ssl/server.key
        -c ssl_min_protocol_version=TLSv1.2
    environment:
      # Superuser, only used by the init script to create the two databases below.
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      # Passed through to db/00-init-databases.sh
      N8N_DB_USER: ${N8N_DB_USER}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      CLAIMFLOW_DB_USER: ${CLAIMFLOW_DB_USER}
      CLAIMFLOW_DB_PASSWORD: ${CLAIMFLOW_DB_PASSWORD}
      TZ: ${TZ}
      PGTZ: ${TZ}
    volumes:
      # Named volume (not a folder in OneDrive), because sync tools can corrupt live DB files.
      - pg_data:/var/lib/postgresql/data
      # Scripts in this folder run once, the first time the volume is empty.
      - ./db/00-init-databases.sh:/docker-entrypoint-initdb.d/00-init-databases.sh:ro
      # SQL files the init script loads into the claimflow DB.
      - ./db:/claimflow-sql:ro
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"     # TLS required for TCP connections
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    # Fake SMTP server + web inbox. Every email n8n sends lands here.
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_TLS_CERT: /certs/mailpit.crt
      MP_SMTP_TLS_KEY: /certs/mailpit.key
      MP_SMTP_REQUIRE_STARTTLS: "true"         # refuse plain-text SMTP
      MP_MAX_MESSAGES: "5000"
      TZ: ${TZ}
    volumes:
      - ./certs:/certs:ro
    # No host ports: SMTP (1025) is internal only; the web UI is served through Caddy.

  n8n:
    image: n8nio/n8n:2.47.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment: *n8n-env
    volumes:
      - n8n_data:/home/node/.n8n
      # Workflow JSON and setup helpers are mounted so the n8n CLI can import them.
      - ./workflows:/workflows
      - ./scripts:/scripts:ro
      - ./certs:/certs:ro
    # No host port: reach n8n through Caddy at https://localhost:${HTTPS_PORT}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama:
    # Optional free local LLM. Only starts when the "ollama" profile is on
    # (COMPOSE_PROFILES=ollama in .env, or --profile ollama). Uses an NVIDIA GPU if Docker can see one; remove the "deploy" block
    # on machines without one and it runs on CPU (slower).
    image: ollama/ollama:0.40.16
    profiles: ["ollama"]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "30m"   # keep the model loaded between claims
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"

  init:
    # One-shot, first run only:  docker compose run --rm init
    # Creates .env (fresh secrets) and the local CA + TLS certificates, so the host needs no
    # openssl. Never starts with "up" (profile). Safe to re-run: fills in only what's missing.
    image: alpine:3.24.4
    profiles: ["init"]
    working_dir: /work
    volumes:
      - ./:/work
    entrypoint: ["/bin/sh", "/work/scripts/init.sh"]

  deploy:
    # One-shot, runs on every "docker compose up -d" once n8n is healthy, then exits:
    # n8n credentials, seed PII encryption, import + publish workflows, Ollama model pull.
    # Logs: docker compose logs deploy
    image: n8nio/n8n:2.47.7
    restart: "no"
    depends_on:
      n8n:
        condition: service_healthy
      ollama:
        condition: service_started
        required: false          # only when the ollama profile is on
    environment: *n8n-env
    volumes:
      - ./workflows:/workflows:ro
      - ./scripts:/scripts:ro
      - ./certs:/certs:ro
    entrypoint: ["node", "/scripts/deploy.js"]

volumes:
  pg_data:
  n8n_data:
  caddy_data:
  ollama_data:

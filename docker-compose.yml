# ClaimFlow — local stack
#   docker compose up -d                      -> n8n + Postgres + Mailpit
#   docker compose --profile ollama up -d     -> also starts a local LLM
#
# All ports bind to 127.0.0.1 only, so nothing is exposed to your network.

name: claimflow

services:
  postgres:
    image: postgres:16.16-alpine
    restart: unless-stopped
    environment:
      # Superuser, only used by the init script to create the two databases below.
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      # Passed through to db/00-init-databases.sh
      N8N_DB_USER: ${N8N_DB_USER}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      CLAIMFLOW_DB_USER: ${CLAIMFLOW_DB_USER}
      CLAIMFLOW_DB_PASSWORD: ${CLAIMFLOW_DB_PASSWORD}
      TZ: ${TZ}
      PGTZ: ${TZ}
    volumes:
      # Named volume (not a folder in OneDrive), because sync tools can corrupt live DB files.
      - pg_data:/var/lib/postgresql/data
      # Scripts in this folder run once, the first time the volume is empty.
      - ./db/00-init-databases.sh:/docker-entrypoint-initdb.d/00-init-databases.sh:ro
      # SQL files the init script loads into the claimflow DB (schema/seed, stage 2).
      - ./db:/claimflow-sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    # Fake SMTP server + web inbox. Every email n8n sends lands here.
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "5000"
      TZ: ${TZ}
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT}:8025"   # web inbox
      # SMTP (1025) is only reachable inside the Docker network; n8n uses mailpit:1025.

  n8n:
    image: n8nio/n8n:2.47.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      # --- n8n's own storage: workflows, credentials, execution history ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}

      # Encrypts stored credentials. If you lose it, saved credentials become unreadable.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # --- URLs: webhooks and approval links in emails are built from WEBHOOK_URL ---
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_PUBLIC_URL}
      N8N_EDITOR_BASE_URL: ${N8N_PUBLIC_URL}
      N8N_SECURE_COOKIE: "false"   # plain http on localhost

      # --- Locale ---
      GENERIC_TIMEZONE: ${TZ}      # used by Schedule Trigger (07:00 SAST report)
      TZ: ${TZ}

      # --- Behaviour ---
      # Code nodes read LLM_MODE and the rules config from env, which n8n 2.x blocks by default.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Code nodes run in a "task runner" process; cap each run (default will change upstream).
      N8N_RUNNERS_TASK_TIMEOUT: "60"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"   # hours (14 days)

      # --- App settings read by the workflows via $env ---
      LLM_MODE: ${LLM_MODE}
      OPENAI_MODEL: ${OPENAI_MODEL}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      CLAIMFLOW_FRAUD_TEAM_EMAIL: ${CLAIMFLOW_FRAUD_TEAM_EMAIL}
      CLAIMFLOW_OPS_EMAIL: ${CLAIMFLOW_OPS_EMAIL}
      CLAIMFLOW_FROM_EMAIL: ${CLAIMFLOW_FROM_EMAIL}
      CLAIMFLOW_REVIEW_TIMEOUT_HOURS: ${CLAIMFLOW_REVIEW_TIMEOUT_HOURS}

      # --- Used only by scripts/setup.sh to create credentials (never stored in workflow JSON) ---
      CLAIMFLOW_DB_USER: ${CLAIMFLOW_DB_USER}
      CLAIMFLOW_DB_PASSWORD: ${CLAIMFLOW_DB_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
      # Workflow JSON is mounted so the n8n CLI can import/export it.
      - ./workflows:/workflows
    ports:
      - "127.0.0.1:${N8N_PORT}:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama:
    # Optional free local LLM. Only starts with: --profile ollama
    image: ollama/ollama:0.40.16
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT}:11434"

volumes:
  pg_data:
  n8n_data:
  ollama_data:
